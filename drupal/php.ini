; PHP settings for the hosted site — Platform.sh reads this file from the
; app root (drupal/). Restored 29 Sep 2026 from main's, which the move into
; drupal/ dropped (backend audit C6), and measured against the host first:
; its web PHP ran opcache at 4000 files / 64 MB against 19,198 PHP files in
; the codebase, revalidated every file on every request, and had
; display_errors On.

assert.active = Off
display_errors = Off
display_startup_errors = Off
max_execution_time = 30
zend.detect_unicode = Off

; Sessions: refuse an id the server did not issue; collect garbage from cron,
; not on a visitor's request.
session.use_strict_mode = On
session.gc_probability = 0

; Opcache: room for the whole codebase (19k files; the next step up from
; 30000 is 32531), and a minute between checks of a file's timestamp.
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 30000
opcache.revalidate_freq = 60
opcache.enable_cli = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 3600

; Uploads: the host's own 64 MB, stated rather than inherited.
upload_max_filesize = 64M
post_max_size = 64M
