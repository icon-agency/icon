services:
  icon_site.twig_extension:
    class: Drupal\icon_site\Twig\IconSiteExtension
    arguments: ['@entity_type.manager', '@stream_wrapper_manager']
    tags:
      - { name: twig.extension }
  icon_site.theme_negotiator.panel_dialog:
    class: Drupal\icon_site\Theme\PanelDialogThemeNegotiator
    arguments: ['@request_stack', '@config.factory', '@current_user']
    tags:
      - { name: theme_negotiator, priority: 1002 }
  # /about/<team member> reaches the About page; the panel opens from the URL.
  icon_site.path_processor.team_profile:
    class: Drupal\icon_site\PathProcessor\TeamProfilePathProcessor
    tags:
      - { name: path_processor_inbound, priority: 300 }
