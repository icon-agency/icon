# The Canvas side panel's ordered lists (hero slides, featured picks): card
# styling, a delegated drag-to-reorder, and Drupal's ajax dialog so Edit /
# Add open over the editor. Attached to the Canvas editor page by
# icon_site_page_attachments().
panel_lists:
  css:
    component:
      css/panel-lists.css: {}
  js:
    js/panel-sortable.js: {}
  dependencies:
    - core/drupal
    - core/drupal.dialog.ajax

# The environment name as a badge in the Navigation top bar (EnvironmentBadge).
environment_badge:
  css:
    component:
      css/environment-badge.css: {}

# The Work body's Add Block dialog in groups (block-picker.css); attached by
# icon_site_field_widget_complete_form_alter() on that widget.
block_picker:
  css:
    component:
      css/block-picker.css: {}

# The Work form's Tile details, two up (work-tiles.css); attached by
# _icon_site_work_tile_group().
work_tiles:
  css:
    component:
      css/work-tiles.css: {}

# The Canvas editor's Page data panel — the node form dressed in one quiet
# register (page-data.css) with colour swatches (page-data.js); the form
# attaches it (icon_site_form_node_form_alter()).
page_data:
  css:
    component:
      css/page-data.css: {}
  js:
    js/page-data.js: {}
  dependencies:
    - core/drupal
    - core/once
