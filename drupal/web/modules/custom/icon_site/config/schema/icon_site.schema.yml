# Fully validatable, so Drupal Canvas accepts the block as a component
# (docs/components.md §3.2.2) and edits its settings in the side panel.
block.settings.icon_clients_marquee:
  type: block_settings
  label: 'Clients marquee block settings'
  constraints:
    FullyValidatable: ~
  mapping:
    heading:
      type: label
      label: 'Accessible label'

block.settings.icon_hero:
  type: block_settings
  label: 'Homepage hero block settings'
  constraints:
    FullyValidatable: ~
  mapping:
    order:
      type: sequence
      label: 'Slide order'
      sequence:
        type: integer
        label: 'Hero slide ID'
        constraints:
          Range:
            min: 1

block.settings.icon_featured_work:
  type: block_settings
  label: 'Featured work block settings'
  constraints:
    FullyValidatable: ~
  mapping:
    latest:
      type: boolean
      label: 'Show the latest five automatically'
    projects:
      type: sequence
      label: 'Featured projects, in order'
      sequence:
        type: integer
        label: 'Work item ID'
        constraints:
          Range:
            min: 1

block.settings.icon_news_latest:
  type: block_settings
  label: 'News feed block settings'
  constraints:
    FullyValidatable: ~
  mapping:
    count:
      type: integer
      label: 'Stories shown'
      constraints:
        Range:
          min: 1
          max: 6

icon_site.footer:
  type: config_object
  label: 'Global footer'
  mapping:
    talk:
      type: label
      label: 'Call to action'
    touch:
      type: label
      label: 'Call to action link'
    touch_url:
      type: string
      label: 'Call to action URL'
    newsletter:
      type: label
      label: 'Newsletter line'
    acknowledgement:
      type: text
      label: 'Acknowledgement of Country'
    login_hero:
      type: integer
      label: 'The Canvas page whose hero the login page plays (0 = the front page)'
