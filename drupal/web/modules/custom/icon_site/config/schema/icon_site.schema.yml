# Fully validatable, so Drupal Canvas accepts the block as a component
# (docs/components.md §3.2.2) and edits its settings in the side panel.
block.settings.icon_clients_marquee:
  type: block_settings
  label: 'Clients marquee block settings'
  constraints:
    FullyValidatable: ~
  mapping:
    heading:
      type: label
      label: 'Accessible label'

block.settings.icon_hero:
  type: block_settings
  label: 'Homepage hero block settings'
  constraints:
    FullyValidatable: ~
  mapping:
    order:
      type: sequence
      label: 'Slide order'
      sequence:
        type: integer
        label: 'Hero slide ID'
        constraints:
          Range:
            min: 1

block.settings.icon_featured_work:
  type: block_settings
  label: 'Featured work block settings'
  constraints:
    FullyValidatable: ~
  mapping:
    latest:
      type: boolean
      label: 'Show the latest five automatically'
    projects:
      type: sequence
      label: 'Featured projects, in order'
      sequence:
        type: integer
        label: 'Work item ID'
        constraints:
          Range:
            min: 1

block.settings.icon_news_latest:
  type: block_settings
  label: 'News feed block settings'
  constraints:
    FullyValidatable: ~
  mapping:
    count:
      type: integer
      label: 'Stories shown'
      constraints:
        Range:
          min: 1
          max: 6

icon_site.footer:
  type: config_object
  label: 'Global footer'
  mapping:
    eyebrow:
      type: label
      label: 'Call to action eyebrow'
    talk:
      type: label
      label: 'Call to action'
    touch:
      type: label
      label: 'Call to action link'
    touch_url:
      type: string
      label: 'Call to action URL'
    newsletter:
      type: label
      label: 'Newsletter line'
    acknowledgement:
      type: text
      label: 'Acknowledgement of Country'
    login_hero:
      type: integer
      label: 'The Canvas page whose hero the login page plays (0 = the front page)'

block.settings.icon_office:
  type: block_settings
  label: 'Offices: one block settings'
  constraints:
    FullyValidatable: ~
  mapping:
    office:
      type: integer
      label: 'Office'

block.settings.icon_contact_form:
  type: block_settings
  label: 'Contact form block settings'
  constraints:
    FullyValidatable: ~

block.settings.icon_testimonial:
  type: block_settings
  label: 'Testimonial (item) block settings'
  constraints:
    FullyValidatable: ~
  mapping:
    testimonial:
      type: integer
      label: 'Testimonial'

block.settings.icon_work_latest:
  type: block_settings
  label: 'Work: latest block settings'
  constraints:
    FullyValidatable: ~
  mapping:
    accent:
      type: label
      label: 'Heading, first line'
    caps:
      type: label
      label: 'Heading, second line'
    category:
      type: string
      label: 'Feed'
    count:
      type: integer
      label: 'Items shown'
    # the lines came after the rails were placed (23 Sep 2026): an instance
    # without them is valid and has both; `rules` was the single setting of
    # one day, read as both
    rules:
      type: boolean
      label: 'Lines above and below (superseded)'
      requiredKey: false
    rule_top:
      type: boolean
      label: 'Line above'
      requiredKey: false
    rule_bottom:
      type: boolean
      label: 'Line below'
      requiredKey: false

block.settings.icon_team_profiles:
  type: block_settings
  label: 'Team profiles block settings'
  constraints:
    FullyValidatable: ~
  mapping:
    heading:
      type: label
      label: 'Heading'

block.settings.icon_filmstrip:
  type: block_settings
  label: 'Filmstrip block settings'
  constraints:
    FullyValidatable: ~
  mapping:
    heading:
      type: label
      label: 'Accessible label'
    photos:
      type: sequence
      label: 'Photos, in order'
      sequence:
        type: integer
        label: 'Image media ID'
        constraints:
          Range:
            min: 1
    stats:
      type: sequence
      label: 'Fact cards'
      sequence:
        type: mapping
        label: 'Fact card'
        mapping:
          icon:
            type: integer
            label: 'Icon media ID'
          title:
            type: label
            label: 'Heading'
          label:
            type: label
            label: 'Label'
    every:
      type: integer
      label: 'A fact card after every N photos'
      constraints:
        Range:
          min: 1
          max: 8

block.settings.icon_expertise_links:
  type: block_settings
  label: 'Expertise links block settings'
  constraints:
    FullyValidatable: ~
  mapping:
    heading:
      type: label
      label: 'The label beside the list'
    gutter:
      type: boolean
      label: 'On the page gutter'
