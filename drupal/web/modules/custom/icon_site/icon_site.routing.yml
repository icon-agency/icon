icon_site.client_logos:
  path: '/admin/content/client-logos'
  defaults:
    _form: '\Drupal\icon_site\Form\ClientLogosForm'
    _title: 'Client logos'
  requirements:
    _permission: 'administer media'
icon_site.fact_icons:
  path: '/admin/content/fact-icons'
  defaults:
    _form: '\Drupal\icon_site\Form\FactIconsForm'
    _title: 'Fact icons'
  requirements:
    _permission: 'administer media'
icon_site.news_action:
  path: '/icon-site/news-action'
  defaults:
    _controller: '\Drupal\icon_site\Controller\NewsActionController::act'
  requirements:
    _permission: 'edit any news content'
    _csrf_token: 'TRUE'
icon_site.logo_action:
  path: '/icon-site/logo-action'
  defaults:
    _controller: '\Drupal\icon_site\Controller\LogoActionController::act'
  requirements:
    _permission: 'administer media'
    _csrf_token: 'TRUE'
