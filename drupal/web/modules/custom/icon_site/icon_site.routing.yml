icon_site.client_logos:
  path: '/admin/content/client-logos'
  defaults:
    _form: '\Drupal\icon_site\Form\ClientLogosForm'
    _title: 'Client logos'
  requirements:
    _permission: 'manage icon lists'
icon_site.fact_icons:
  path: '/admin/content/fact-icons'
  defaults:
    _form: '\Drupal\icon_site\Form\FactIconsForm'
    _title: 'Icons'
  requirements:
    _permission: 'manage icon lists'
icon_site.news_action:
  path: '/icon-site/news-action'
  defaults:
    _controller: '\Drupal\icon_site\Controller\NewsActionController::act'
  methods: [POST]
  requirements:
    _permission: 'edit any news content'
    _csrf_token: 'TRUE'
icon_site.logo_action:
  path: '/icon-site/logo-action'
  defaults:
    _controller: '\Drupal\icon_site\Controller\LogoActionController::act'
  methods: [POST]
  requirements:
    _permission: 'manage icon lists'
    _csrf_token: 'TRUE'
icon_site.offices:
  path: '/admin/content/offices'
  defaults:
    _form: '\Drupal\icon_site\Form\OfficesForm'
    _title: 'Offices'
  requirements:
    _permission: 'edit any office content'
icon_site.footer:
  path: '/admin/content/footer'
  defaults:
    _form: '\Drupal\icon_site\Form\FooterSettingsForm'
    _title: 'Footer'
  requirements:
    _permission: 'manage icon footer'
