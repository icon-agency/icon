$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Expertise link (item)
group: Expertise
status: stable
description: One service in an Expertise links list. Off the library since Sep 2026 — the Expertise links block renders one per menu child; the ones placed before still render.
props:
  type: object
  required:
    - label
    - url
  properties:
    label:
      type: string
      title: Service
      examples:
        - Creative
    url:
      type: string
      format: uri-reference
      title: Link
      examples:
        - /services#creative
