$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Expertise link (item)
group: Expertise
status: stable
description: One service in an Expertise links list — the intro's, or one standing on a page.
props:
  type: object
  required:
    - label
    - url
  properties:
    label:
      type: string
      title: Service
      examples:
        - Creative
    url:
      type: string
      format: uri-reference
      title: Link
      examples:
        - /services#creative
