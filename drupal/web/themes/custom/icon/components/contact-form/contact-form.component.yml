$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Contact form
group: Listings
status: stable
description: |
  The enquiry form (src/components/contact-form.css): it opens on a
  question — "What is this about?", Business enquiry or Careers — and shows
  the form for the answer: the fields, label over a hairline, the answer
  beneath, and "Send your message" as the quiet invitation link. Words
  above the question are a Content component placed before it.
  Rendered by the Contact form block (icon_site), which builds the site's
  two Contact forms (the core Contact module's "Contact" and "Careers"
  forms: Content → Contact forms sets who receives each) into the slots;
  place the block.
props:
  type: object
  properties:
    topic:
      type: string
      title: Topic shown
      description: >
        Which answer is ticked when the frame renders — the block ticks
        Careers when that form came back with errors, so they are seen.
      enum:
        - business
        - careers
      default: business
slots:
  form:
    title: The business enquiry form
    description: The Contact message form, built by the block.
  careers:
    title: The careers form
    description: The Careers message form, built by the block.
