$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Masthead
status: stable
description: |
  The centred page masthead: a serif accent line over the big caps line, the
  lockup the /work and /news listings open with. The words rise per word on
  the shared cascade. Two slots carry what those listings add underneath —
  the Subscribe bar inside the centred column, a full-width band below it.
props:
  type: object
  required:
    - accent
    - caps
  properties:
    accent:
      type: string
      title: Accent line
      description: The short serif line above, in sentence case. The section's name.
      examples:
        - Work
    caps:
      type: string
      title: Headline
      description: The large caps line. Type it in sentence case; the CSS sets the capitals.
      examples:
        - Selected work and case studies
    heading_level:
      type: string
      title: Heading level
      description: h1 for a page's own masthead, h2 where the page already has one.
      enum:
        - h1
        - h2
      examples:
        - h1
    opening:
      type: string
      title: Opens on
      description: >
        The colour the page opens on — the whole page, wordmark and pill
        included — handing over to the site's light theme as this masthead
        scrolls away (js/theme-handover.js). Black is the dark theme; ICON
        blue and light grey take their own ink; Custom takes the two hex
        values below.
      enum:
        - none
        - dark
        - blue
        - light-grey
        - custom
      meta:enum:
        none: The page theme (no handover)
        dark: Black (the dark theme)
        blue: ICON blue
        light-grey: Light grey
        custom: Custom colours (below)
      examples:
        - none
    bg:
      type: string
      title: Custom background
      description: 'A hex colour, e.g. #f0f4f9. Used when Opens on is Custom.'
      examples:
        - '#f0f4f9'
    ink:
      type: string
      title: Custom foreground
      description: 'The text and line colour on it, a hex value, e.g. #0d0d0d.'
      examples:
        - '#0d0d0d'
slots:
  extras:
    title: Under the heading
    description: Inside the centred column, under the lockup — the listings put the Subscribe bar here.
  band:
    title: Full-width band
    description: Below the centred column, still inside the masthead — the listings put the filter chips here.
