$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Gallery
group: Pictures
status: stable
description: |
  A row of the work article's media (src/components/work-gallery.css): one
  figure across, or two side by side from 768. The figures are Figure
  components in the slot — the shape the article's Paragraphs already have
  (work_gallery_row holds work_gallery_figure) and the only one Canvas can
  author: it has no field type for a prop that is a list of objects.
props:
  # Declared and empty on purpose: a component with no `props` key at all
  # reads as having no schema, and SDC rejects it. The column count is the
  # number of figures in the slot, counted in the template.
  type: object
  properties: {}
slots:
  figures:
    title: Figures
    description: One or two. Two sit side by side from 768; on a phone they stack.
