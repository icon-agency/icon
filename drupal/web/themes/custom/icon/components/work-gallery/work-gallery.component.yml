$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Work gallery
group: Work
status: stable
description: >
  The work article's media rows (src/components/work-gallery.css): one or two
  figures per row, each an image, a looping film, or a layered figure — a
  float over a media or colour ground, wide or square. Fed by consecutive
  Gallery row blocks of Figures.
props:
  type: object
  required:
    - rows
  properties:
    rows:
      type: array
      title: Rows
      items:
        type: object
        properties:
          figures:
            type: array
            items:
              type: object
              properties:
                style:
                  type: string
                  enum: [plain, portrait, layered, layered_square]
                ground:
                  type: string
                pad:
                  type: string
                media:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string, enum: [image, video] }
                      src: { type: string }
                      alt: { type: string }
                      width: { type: integer }
                      height: { type: integer }
      examples:
        - - figures:
              - style: plain
                media:
                  - type: image
                    src: https://placehold.co/1600x900
                    alt: Campaign creative
                    width: 1600
                    height: 900
