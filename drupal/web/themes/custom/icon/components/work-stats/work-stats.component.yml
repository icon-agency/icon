$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Results
group: Work
status: stable
description: |
  The results band — two columns of ruled cells, each a figure over what it
  counts (src/components/work-stats.css). The cells are Result components in
  the slot, which is the shape the article's Paragraphs already have
  (work_stats holds work_stat) and the only shape Canvas can author: it has
  no field type for a prop that is a list of objects.
props:
  # Declared and empty on purpose: a component with no `props` key at all
  # reads as having no schema, and SDC rejects it. Everything the band shows
  # comes through the slot.
  type: object
  properties: {}
slots:
  results:
    title: Results
    description: One Result per figure. Two to the row.
