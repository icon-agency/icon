$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Homepage hero
group: Homepage
status: stable
description: >
  The stack-takeover hero (templates/homeC.html, src/utilities/home-c.css,
  js/home-c.js): the slides pop onto a pile, take over the screen, then play
  as a reel under the drawn "Make what matters" lockup, each with its client
  name (a link) bottom-left. The slides are Hero slide components in the
  slot — add, reorder (drag in the layers panel), edit and delete them there;
  up to eight. Each renders once, as a pile card; the reel is built from the
  pile by js/home-c.js.
libraryOverrides:
  dependencies:
    - icon/hero-loader
    - icon/home-c
slots:
  slides:
    title: Slides
    description: >
      Hero slide components, in reel order — up to eight. Each is a film
      (6 seconds, muted, loops) or an image from the media library, with the
      client name and where it links.
