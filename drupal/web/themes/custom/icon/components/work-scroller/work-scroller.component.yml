$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Gallery scroller
group: Work article
status: stable
description: The drifting gallery strip for a series — posters, clippings, looping films — on an optional colour ground (src/components/work-scroller.css, js/work-scroller.js).
props:
  type: object
  required:
    - items
  properties:
    items:
      type: array
      title: Images
      description: The strip, in order. Portraits and landscapes mix freely; the strip drifts and can be dragged.
      # Required and multiple: Canvas asks for the floor as well as the shape.
      minItems: 1
      items:
        $ref: json-schema-definitions://canvas.module/image
      examples:
        - - src: https://placehold.co/800x1100
            alt: Poster
            width: 800
            height: 1100
    films:
      type: array
      title: Films (looping)
      description: Short films that loop, muted, after the images. Pick Video media or upload an MP4.
      items:
        $ref: json-schema-definitions://canvas.module/video
      examples:
        - - src: https://example.com/loop.mp4
    ground:
      type: string
      title: Ground colour
      examples:
        - '#2e2e2e'
