$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Picture scroller (group)
group: Pictures
status: stable
description: >
  The drifting strip for a series — posters, clippings, looping films — on
  an optional colour ground (src/components/work-scroller.css,
  js/work-scroller.js). Its pictures are Picture components in the slot
  (Sep 2026; it was a list of images and a list of films).
libraryOverrides:
  dependencies:
    - icon/work-scroller
props:
  type: object
  properties:
    ground:
      type: string
      title: Ground colour
      description: The colour behind the strip, a hex value, e.g. #2e2e2e. Leave empty for none.
slots:
  pictures:
    title: Pictures
    description: Picture components, in the order they drift past. Portraits and landscapes mix freely; a film loops.
