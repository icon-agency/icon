$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Video embed
group: Video
status: stable
description: >
  An embedded film in the article flow — the wide figure band at the
  player's own 16:9 (src/utilities/news-article.css, .news-article__figure--video).
  Click to play, as the old site had it (16 Oct 2026): a cover still with the
  play control over it, and the player loads on the click (js/video-embed.js).
  Pick a Cover, or leave it empty for the film's own thumbnail.
libraryOverrides:
  dependencies:
    - icon/video-embed
props:
  type: object
  required:
    - embed_url
    - title
  properties:
    embed_url:
      type: string
      format: uri
      title: Embed URL
      description: >
        The player's embed address — https://www.youtube-nocookie.com/embed/VIDEO_ID
        or https://player.vimeo.com/video/VIDEO_ID — not the watch-page link.
      examples:
        - 'https://www.youtube-nocookie.com/embed/9kqQ7fBv7bM?rel=0&modestbranding=1&playsinline=1'
    title:
      type: string
      title: Title
      description: Names the film for assistive tech (the iframe title).
      examples:
        - 'Campaign film'
    cover:
      $ref: json-schema-definitions://canvas.module/image
      type: object
      title: Cover
      description: Optional — the still shown with the play control before the film loads, from the media library. Leave it empty and the film's own thumbnail is used.
      examples:
        - src: https://placehold.co/1600x900
          alt: Film cover
          width: 1600
          height: 900
