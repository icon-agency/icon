$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Columns and boxes
group: Layout
status: stable
description: >
  One, two, three or four columns side by side, each a drop slot that takes
  any block — Content, an Image, a Pull quote, a Fact card. Equal widths;
  they stack on a phone, pair from 768px and take the chosen count from
  1024px. One column is a single slot, the page's width — the way to put
  one block in a box. Change the count and the columns you have filled
  stay. Optionally in a
  BOX: padded, on the site's corner, on a ground of its own — white, light
  grey, black, ICON blue or a custom pair — whose ink everything inside
  takes, the way a page opening on that colour would. Optionally a LINK:
  the whole box goes somewhere, and shows it on hover.
props:
  type: object
  required:
    - columns
    - split
    - gap
    - box
  properties:
    columns:
      type: integer
      title: Columns
      description: How many, side by side — one is a single slot, for one block in a box.
      enum:
        - 1
        - 2
        - 3
        - 4
      examples:
        - 2
    split:
      type: string
      title: Split
      description: For two columns — even halves, or a third beside two thirds either way round. Three and four columns are always even.
      enum:
        - even
        - narrow-wide
        - wide-narrow
      meta:enum:
        even: Even
        narrow-wide: One third + two thirds
        wide-narrow: Two thirds + one third
      examples:
        - even
    gap:
      type: string
      title: Gap
      description: The space between the columns.
      enum:
        - normal
        - wide
        - tight
      meta:enum:
        normal: Normal (the page's column gutter)
        wide: Wide (a section's air between them)
        tight: Tight (the gallery's 16px)
      examples:
        - normal
    box:
      type: string
      title: Box
      description: >
        Put the columns in a box — padded, on the site's corner — on a
        ground of its own. What is inside takes that ground's ink: black is
        the dark theme, ICON blue and light grey their own, Custom the two
        hex values below.
      enum:
        - none
        - white
        - light-grey
        - black
        - blue
        - custom
      meta:enum:
        none: No box (on the page)
        white: White
        light-grey: Light grey
        black: Black (the dark theme)
        blue: ICON blue
        custom: Custom colours (below)
      examples:
        - none
    bg:
      type: string
      title: Custom background
      description: 'A hex colour, e.g. #edeef5. Used when Box is Custom.'
    ink:
      type: string
      title: Custom foreground
      description: 'The text and line colour on it, a hex value, e.g. #0d0d0d.'
    link:
      type: string
      format: uri-reference
      title: Link
      description: >
        Optional: the whole box links here — a click anywhere on it goes
        through, the links inside still work, and it lifts on hover. Leave
        empty for no link.
    link_label:
      type: string
      title: Link name
      description: What the link is called for screen readers, e.g. the box's heading. Used when Link is set.
slots:
  column_1:
    title: Column 1
    description: The first column's blocks.
  column_2:
    title: Column 2
    description: The second column's blocks.
  column_3:
    title: Column 3
    description: The third column's blocks — with three or four columns.
  column_4:
    title: Column 4
    description: The fourth column's blocks — with four columns.
