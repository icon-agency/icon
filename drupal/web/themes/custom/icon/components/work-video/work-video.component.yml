$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Video hosted
group: Video
status: stable
description: The click-to-play film with an art-directed cover — the sound-on cut (src/components/work-video.css, js/work-video.js).
props:
  type: object
  required:
    - film
    - cover
    - title
  properties:
    film:
      $ref: json-schema-definitions://canvas.module/video
      type: object
      title: Film
      description: A Video from the media library — the same picker every other film on the site uses (Sep 2026; it was a file path).
      examples:
        - src: /sites/default/files/work/film.mp4
    cover:
      $ref: json-schema-definitions://canvas.module/image
      type: object
      title: Cover
      examples:
        - src: https://placehold.co/1600x900
          alt: Film cover
          width: 1600
          height: 900
    title:
      type: string
      title: Title
      examples:
        - Fit for every run — the film
