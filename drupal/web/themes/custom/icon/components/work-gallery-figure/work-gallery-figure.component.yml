$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Gallery row picture (item)
group: Gallery
status: stable
description: |
  One figure in a gallery row (src/components/work-gallery.css): a picture
  or film, or a layered pair — a cut-out floating over a ground, wide or
  square. Each is one pick from the media library (Sep 2026: it was
  pictures and a film apart). Sits in a Gallery row's slot.
props:
  type: object
  properties:
    picture:
      type: integer
      x-icon-media: picture-or-film
      title: Picture
      description: >
        One pick from the media library — a picture, or a film that loops,
        muted. The whole of a plain or portrait figure; on a layered one,
        the ground the cut-out floats over (or leave it for the ground
        colour below).
    float:
      type: integer
      x-icon-media: picture-or-film
      title: Cut-out
      description: >
        For a layered figure: what floats over the ground — a cut-out
        picture with a transparent background, or a film.
    style:
      type: string
      title: Style
      description: >
        Plain runs at the picture's own shape. Portrait crops to 7:10, so a
        reel and a tall clipping pair evenly. The layered pair float a
        cut-out over a ground, 16:9 or square.
      enum:
        - plain
        - portrait
        - layered
        - layered_square
      examples:
        - plain
    ground:
      type: string
      title: Ground colour
      description: For a layered figure — the colour behind the float, when there is no background picture. A hex value.
    pad:
      type: string
      title: Float inset
      description: How far in from each edge the floating cut-out sits, so 22% leaves it 56% of the figure wide (50% would leave nothing; over 40% is capped). Leave empty for the default.
