$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Fact card (filmstrip)
group: Homepage
status: stable
description: >
  A blue fact card in the intro filmstrip — an icon from the site's Fact
  icons (Icon media, inlined so it takes the card's white), headline figure,
  label under a hairline.
props:
  type: object
  required:
    - icon
    - title
  properties:
    icon:
      type: integer
      x-icon-media: true
      title: Icon
      description: 'Pick from the site’s icon set. Add, rename, reorder or remove icons at Content → Fact icons (/admin/content/fact-icons); new ones appear here straight away.'
      examples:
        - 1
    title:
      type: string
      title: Heading
      examples:
        - 14 Agency of the Year awards
    label:
      type: string
      title: Label
      examples:
        - Since 2021
